// CS2 Autoexec Configuration
// This file loads automatically when the game starts

// Load custom binds
exec my_binds.cfg

// Basic game settings
fps_max 237                         // Unlimited FPS (0 = unlimited in CS2)
cl_showfps 0                        // Show FPS counter

// Mouse settings
sensitivity 1.0                     // Mouse sensitivity
zoom_sensitivity_ratio 1.0          // Zoom / scope sensitivity ratio

// Crosshair settings (basic)
cl_crosshairdot 0
cl_crosshair_drawoutline 1
cl_crosshair_outlinethickness 1.0
cl_crosshairsize 5.0
cl_crosshairthickness 0.5
cl_crosshairgap -1.0
cl_crosshaircolor 5
cl_crosshaircolor_r 255
cl_crosshaircolor_g 255
cl_crosshaircolor_b 255
cl_crosshairalpha 255

// HUD settings
hud_scaling 1.0                     // HUD scale
cl_radar_square_always 1            // Radar as square
cl_hud_radar_scale 1.3              // Radar scale
cl_radar_scale 1.0                  // Radar zoom

// Save configuration
host_writeconfig

echo "autoexec.cfg has loaded successfully!"