// Custom CS2 Bind Configuration

// Movement Binds
bind "w" "+forward"                 // Move forward
bind "s" "+back"                    // Move backward
bind "a" "+left"                    // Move left
bind "d" "+right"                   // Move right

bind "alt" "+duck"                  // Crouch
bind "space" "+jump"                // Regular jump
bind "r" "+reload"                  // Reload

// Combat Binds
bind "mouse1" "+attack"             // Primary fire (left mouse button)
bind "mouse2" "+attack2"            // Secondary fire (right mouse button)
bind "mouse3" "player_ping"         // Player ping
bind "mouse4" "+voicerecord"        // Voice chat

// Weapon Binds
bind "q" "slot1"                    // Primary weapon
bind "e" "slot3"                    // Knife
bind "2" "slot2"                    // Secondary weapon
bind "3" "slot11"                   // Zeus (taser)
bind "4" "slot5"                    // Explosives/Traps (C4, defuse kit)

// Grenades Binds
bind "c" "slot6"                    // HE Grenade
bind "z" "slot7"                    // Flashbang
bind "x" "slot8"                    // Smoke grenade
bind "n" "slot9"                    // Decoy
bind "v" "slot10"                   // Molotov/Incendiary

// Action Binds
bind "f" "+use"                     // Use/Plant bomb
bind "b" "buymenu"                  // Buy menu
bind "g" "drop"                     // Drop weapon
bind "h" "slot12"                   // Health shot
bind "t" "+spray_menu"              // Graffiti menu
bind "mwheeldown" "+lookatweapon"   // Look at weapon
bind "tab" "+showscores"            // Scoreboard
bind "`" "toggleconsole"            // Console toggle

// Misc Binds
bind "y" "messagemode2"             // Team chat
bind "u" "messagemode"              // All chat

// bind "mouse4" "noclip"
// alias "clearON" "say .clear; bind mouse5 cleanupON"
// alias "cleanupON" "say .cleanup; bind mouse5 clearON"
// bind "mouse5" "clearON"

bind "/" "say .smart"
bind "'" "say .spraypattern"
bind "m" "say .randomarenas"
bind "," "say .replay"
bind "." "say .skip"
bind "]" "say .nexttask"
bind "mouse5" "noclip"

echo "my_binds.cfg has been loaded successfully!"